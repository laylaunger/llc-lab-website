project:
  type: website
  output-dir: docs
  resources:
    - assets/cv/unger_cv.pdf

website:
  title: "Language, Learning & Cognition Lab"
  search: false

  navbar:
    background: white
    foreground: "#102b63"
    collapse: true
    collapse-below: lg
    right:
      - text: "Home"
        href: index.qmd
      - text: "People"
        href: people.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Join the Lab"
        href: join.qmd
      - text: "Participate"
        href: participate.qmd

  page-footer:
    border: false
    center: |
      **Language, Learning & Cognition Lab**  
      Department of Psychological and Brain Sciences  
      University of Louisville – Belknap Campus

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      text: |
        <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
        <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">